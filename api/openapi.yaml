info:
  title: VeilBridge Router Core API
  version: 0.1.0
openapi: 3.1.0
paths:
  /apply:
    get:
      operationId: applyState
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyState"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: State of the apply transaction
      tags:
        - apply
    post:
      operationId: applyConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyTxInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyState"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Apply staged configuration with an automatic revert
      tags:
        - apply
  /apply/changes:
    delete:
      operationId: discardStaged
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Throw away the staged draft without touching the device
      tags:
        - apply
    get:
      operationId: stagedChanges
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Configuration edits staged but not yet applied
      tags:
        - apply
  /apply/confirm:
    post:
      operationId: confirmApply
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyConfirmInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyState"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Confirm that the panel survived the change
      tags:
        - apply
  /apply/revert:
    post:
      operationId: revertApply
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyState"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Undo the pending change immediately
      tags:
        - apply
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Exchange admin password for a JWT
      tags:
        - auth
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: "#/components/schemas/Capability"
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: What this device can do, and why not when it cannot
      tags:
        - system
  /config/export:
    get:
      operationId: exportConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                description: Full VeilBridge config document (includes secrets)
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Export the full config (includes secrets)
      tags:
        - config
  /config/import:
    post:
      operationId: importConfig
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Import and apply a backup
      tags:
        - config
  /events:
    get:
      operationId: events
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/ApplyEvent"
                        event:
                          const: apply
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event apply
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/ErrorEvent"
                        event:
                          const: error
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event error
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/SystemEvent"
                        event:
                          const: system
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event system
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: "Live updates: one stream, topics system/apply/error"
      tags:
        - system
  /network/interfaces:
    get:
      operationId: listInterfaces
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/NetworkInterface"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: L3 interfaces as the router's network daemon sees them
      tags:
        - network
  /network/lan:
    get:
      operationId: getLAN
      responses:
        "200":
          content:
