info:
  title: VeilBridge Router Core API
  version: 0.1.0
openapi: 3.1.0
paths:
  /apply:
    get:
      operationId: applyState
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyState"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: State of the apply transaction
      tags:
        - apply
    post:
      operationId: applyConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyTxInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyState"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Apply staged configuration with an automatic revert
      tags:
        - apply
  /apply/confirm:
    post:
      operationId: confirmApply
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyConfirmInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyState"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Confirm that the panel survived the change
      tags:
        - apply
  /apply/revert:
    post:
      operationId: revertApply
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyState"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Undo the pending change immediately
      tags:
        - apply
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Exchange admin password for a JWT
      tags:
        - auth
  /config/export:
    get:
      operationId: exportConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                description: Full VeilBridge config document (includes secrets)
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Export the full config (includes secrets)
      tags:
        - config
  /config/import:
    post:
      operationId: importConfig
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Import and apply a backup
      tags:
        - config
  /nodes:
    get:
      operationId: listNodes
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/NodeWithStatus"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: List nodes with status
      tags:
        - nodes
  /nodes/import:
    post:
      operationId: importNodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Node"
                type:
                  - array
                  - "null"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Import node(s) from a .conf or subscription
      tags:
        - nodes
  /nodes/{id}:
    delete:
      operationId: removeNode
      parameters:
        - description: Node ID
          in: path
          name: id
          required: true
          schema:
            description: Node ID
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Remove a node
      tags:
        - nodes
  /nodes/{id}/activate:
    post:
      operationId: activateNode
      parameters:
        - description: Node ID
          in: path
          name: id
          required: true
          schema:
            description: Node ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Switch the active exit to this node
      tags:
        - nodes
  /nodes/{id}/status:
    get:
      operationId: nodeStatus
      parameters:
        - description: Node ID
          in: path
          name: id
          required: true
          schema:
            description: Node ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Fresh status for one node
      tags:
        - nodes
  /routes:
    get:
      operationId: listRoutes
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RouteRule"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: List routing rules
      tags:
        - routes
    post:
      operationId: addRoute
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRule"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Add a routing rule
      tags:
        - routes
  /routes/apply:
    post:
      operationId: applyRoutes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Apply the rule set to the OS
      tags:
        - routes
  /routes/{id}:
    delete:
      operationId: deleteRoute
      parameters:
        - description: Node ID
          in: path
          name: id
          required: true
          schema:
            description: Node ID
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Delete a routing rule
      tags:
        - routes
    put:
      operationId: updateRoute
      parameters:
        - description: Rule ID
          in: path
          name: id
          required: true
          schema:
            description: Rule ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRule"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Update a routing rule
      tags:
        - routes
  /system:
    get:
      operationId: getSystem
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: System snapshot for the dashboard
      tags:
        - system
  /system/diagnostics:
    get:
      operationId: diagnostics
      parameters:
        - description: Host or IP to diagnose
          explode: false
          in: query
          name: target
          schema:
            description: Host or IP to diagnose
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: ping/traceroute from the agent
      tags:
        - system
  /system/probe:
    post:
      operationId: probePath
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathProbe"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Probe whether traffic goes via tunnel or direct
      tags:
        - system
servers:
  - url: /api/v1
