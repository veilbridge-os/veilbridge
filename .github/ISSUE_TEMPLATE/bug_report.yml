name: Bug report
description: Something does not work as documented
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this form for security
        issues — see [SECURITY.md](../blob/main/SECURITY.md) for private
        reporting.

        Before filing: config files and logs may contain VPN private keys,
        public IP addresses and password hashes. Redact them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        1. Imported an AmneziaWG config
        2. Clicked "Switch exit node"
        3. UI says the tunnel is up, but the egress IP is still the WAN IP
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `veilbridged -version`.
      placeholder: >-
        veilbridged v0.1.0 (a3c1b1e, 2026-09-19T08:00:00Z)
        go1.26.4 linux/arm64
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - OpenWrt (router)
        - OpenWrt (x86 / VM)
        - Demo mode (-demo)
        - Other
    validations:
      required: true

  - type: input
    id: platform-details
    attributes:
      label: Platform details
      description: >-
        OpenWrt release and device model (`ubus call system board`).
      placeholder: OpenWrt 24.10.0 r28427, Cudy WR3000S v1, aarch64

  - type: dropdown
    id: install
    attributes:
      label: How was it installed
      options:
        - Release binary
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Daemon log
      description: >-
        Relevant lines from `logread -e veilbridge`, or the daemon's own output
        if you started it by hand. Rendered as a code block — no backticks
        needed.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: >-
            I removed private keys, passwords and real public IPs from
            what I pasted.
          required: true
        - label: I can reproduce this on the latest release or on `main`.
          required: false
