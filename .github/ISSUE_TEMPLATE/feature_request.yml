name: Feature request
description: Propose a capability or a UX improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        VeilBridge aims to be a full control panel for an OpenWrt router:
        the feature level of a commercial router OS, on any hardware that
        runs OpenWrt.

        Hardware differs wildly — no Wi-Fi radio, no USB, tiny flash. Say
        what your proposal assumes: a feature that cannot exist on a device
        must degrade to a reported capability, not to a broken button.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and what do you do instead?
      placeholder: >-
        I have two exit nodes and want traffic to fail over automatically
        when one stops answering. Today I switch nodes by hand.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the panel do? Which screen does it belong on?
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: What does it need from the hardware
      multiple: true
      options:
        - Nothing special (any OpenWrt device)
        - Wi-Fi radio
        - Multiple LAN ports / switch
        - USB port
        - Extra flash or RAM headroom
    validations:
      required: true

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: >-
        How do Keenetic, LuCI, OPNsense or others solve this? Links to
        packages that already implement the mechanism are especially useful —
        VeilBridge prefers to be the interface, not a reimplementation.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
