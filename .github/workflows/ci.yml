name: CI

# Runs on GitHub-hosted runners (ubuntu-latest). No self-hosted runners.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          # go.mod pins go 1.26.3 + a specific gVisor revision; let the toolchain
          # directive resolve the exact compiler if it ever bumps.
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: OpenAPI snapshot is up to date
        # The committed api/openapi.yaml is generated from the Huma handlers.
        # Regenerate and fail if it drifts from what's checked in.
        run: |
          go run ./cmd/veilbridged -dump-openapi > /tmp/openapi.generated.yaml
          if ! diff -u api/openapi.yaml /tmp/openapi.generated.yaml; then
            echo "::error::api/openapi.yaml is stale — run 'go run ./cmd/veilbridged -dump-openapi > api/openapi.yaml'"
            exit 1
          fi

      - name: Cross-compile (linux/amd64 + linux/arm64, static)
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/veilbridged-amd64 ./cmd/veilbridged
          GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/veilbridged-arm64 ./cmd/veilbridged
          ls -la /tmp/veilbridged-amd64 /tmp/veilbridged-arm64

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Type-check + build (vue-tsc runs in build)
        run: npm run build

  ui-binary:
    name: UI binary (-tags ui)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          check-latest: true
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (populates the embedded dist)
        run: |
          cd web
          npm ci
          npm run build

      - name: Build daemon with embedded UI
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -tags ui -o /tmp/veilbridged-ui ./cmd/veilbridged
