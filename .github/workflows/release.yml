name: Release

# Cuts a GitHub Release from a tag: static linux binaries with the web UI
# embedded (-tags ui), plus SHA-256 checksums.
#
# Runs on GitHub-hosted runners only. The tag is the single source of truth
# for the version string baked into the binary.
#
# This workflow publishes artifacts, so it is deliberately stricter than CI:
# actions are pinned to commit SHAs, and the toolchain caches are off (a cache
# is writable from PR jobs, and must not feed a signed-off release build).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Tags + full history: the Go toolchain stamps vcs.revision from it.
          fetch-depth: 0
          # Nothing here pushes; do not leave a token in .git/config.
          persist-credentials: false

      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.4'
          check-latest: true
          cache: false

      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build frontend (populates the embedded dist)
        run: |
          cd web
          npm ci
          npm run build

      - name: Build release binaries
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          pkg=github.com/veilbridge-os/veilbridge/internal/buildinfo
          ldflags="-s -w -X ${pkg}.version=${VERSION}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -tags ui \
              -ldflags "$ldflags" \
              -o "dist/veilbridged-linux-$arch" ./cmd/veilbridged
          done
          ls -la dist

      - name: Verify the built binary reports the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The runner is amd64, so this artifact is the executable one.
          out="$(./dist/veilbridged-linux-amd64 -version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *)
              echo "::error::binary reports '$out', want '$VERSION'"
              exit 1
              ;;
          esac

      - name: 'Smoke test: demo mode serves the embedded UI'
        run: |
          set -euo pipefail
          ./dist/veilbridged-linux-amd64 -demo -listen 127.0.0.1:8099 &
          pid=$!
          trap 'kill $pid' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS -o /tmp/index.html http://127.0.0.1:8099/; then
              break
            fi
            sleep 1
          done
          grep -qi '<div id="app"' /tmp/index.html
          echo "embedded UI served ($(wc -c < /tmp/index.html) bytes)"

      - name: Build OpenWrt packages (.ipk for opkg, .apk for apk-tools 3)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Pinned: the packaging recipe depends on nfpm behaviour (env
          # expansion in contents needs `expand: true`), so an unpinned @latest
          # could change the package without a commit here.
          nfpm=github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          for arch in amd64 arm64; do
            # nfpm expands env vars in `contents`, not inside script files, so
            # bake the target CPU into preinst here. Without it the guard could
            # not tell which build it belongs to before unpacking.
            sed "s/@VB_ARCH@/$arch/g" \
              packaging/scripts/preinst.sh.in > dist/preinst.sh
            grep -q "PKG_ARCH='$arch'" dist/preinst.sh
            # Two formats, one recipe: OpenWrt ≤24.10 consumes .ipk via opkg,
            # 25.12 and later replaced opkg with apk-tools 3 and consume .apk.
            # Shipping only one of them means shipping for oldstable only.
            for fmt in ipk apk; do
              VB_ARCH="$arch" go run "$nfpm" \
                package -f packaging/nfpm.yaml -p "$fmt" \
                -t "dist/veilbridge_${arch}.${fmt}"
            done
          done
          ls -la dist/*.ipk dist/*.apk

      - name: 'Smoke test: the package contains what it promises'
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          tar xzf "$GITHUB_WORKSPACE/dist/veilbridge_arm64.ipk"
          tar xzf control.tar.gz
          tar tzf data.tar.gz
          # Architecture must stay "all": OpenWrt arch names are per-subtarget,
          # so anything else is refused by opkg on real routers.
          grep -qx 'Architecture: all' control
          grep -q 'Depends: .*kmod-tun' control
          # The CPU guard must be present and must name this package's CPU:
          # "Architecture: all" means opkg will not refuse a wrong download, so
          # preinst is the only thing standing between a user and a dead
          # service (proven on a real aarch64 router, see preinst.sh.in).
          test -f preinst
          grep -q "PKG_ARCH='arm64'" preinst
          grep -q 'was-running' preinst
          tar tzf data.tar.gz | grep -qx './usr/bin/veilbridged'
          tar tzf data.tar.gz | grep -qx './etc/init.d/veilbridge'
          echo 'ipk layout ok'

          # apk runs .pre-upgrade/.post-upgrade instead of .pre-install and
          # .post-install once the package is installed. Without those entries
          # an upgrade runs no scripts at all, and a wrong-CPU package replaces
          # a working binary silently (measured on OpenWrt 25.12.5).
          cd "$(mktemp -d)"
          tar xzf "$GITHUB_WORKSPACE/dist/veilbridge_arm64.apk"
          for s in .pre-install .post-install .pre-upgrade .post-upgrade \
            .pre-deinstall .post-deinstall; do
            test -f "$s" || { echo "apk package lacks $s"; exit 1; }
          done
          grep -q "PKG_ARCH='arm64'" .pre-upgrade
          grep -q 'rescue-bin' .pre-upgrade
          grep -q 'rescue-bin' .post-upgrade
          echo 'apk layout ok'

      - name: Checksums
        run: |
          cd dist
          sha256sum veilbridged-linux-* veilbridge_*.ipk veilbridge_*.apk \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        # softprops/action-gh-release v2
        uses: >-
          softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/veilbridged-linux-amd64
            dist/veilbridged-linux-arm64
            dist/veilbridge_amd64.ipk
            dist/veilbridge_arm64.ipk
            dist/veilbridge_amd64.apk
            dist/veilbridge_arm64.apk
            dist/SHA256SUMS
